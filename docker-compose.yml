services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: riftdrop
      POSTGRES_USER: riftdrop
      POSTGRES_PASSWORD: change-before-production
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: ./backend_api
    environment:
      DATABASE_URL: postgresql+asyncpg://riftdrop:change-before-production@database:5432/riftdrop
      ENVIRONMENT: production
    env_file: ./backend_api/.env
    depends_on:
      - database
    ports:
      - "8000:8000"
volumes:
  postgres_data:
